<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Suojattu Tenttijärjestelmä</title>
    <!-- Haetaan Tailwind CSS oikeasta osoitteesta -->
    <script src="https://jsdelivr.net"></script>
</head>
<body class="bg-gray-100 flex items-center justify-center h-screen">

    <div class="bg-white p-8 rounded-lg shadow-md w-96">
        <h1 class="text-2xl font-bold mb-4 text-center">Matematiikan Koe</h1>
        
        <form id="examForm" class="space-y-4">
            <p class="font-medium">Paljonko on 5 + 5?</p>
            <label class="block cursor-pointer"><input type="radio" name="q1" value="5"> 5</label>
            <label class="block cursor-pointer"><input type="radio" name="q1" value="10"> 10</label>
            <label class="block cursor-pointer"><input type="radio" name="q1" value="15"> 15</label>
            
            <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700 transition font-semibold">
                Lähetä vastaukset
            </button>
        </form>
    </div>

    <script>
        document.getElementById('examForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const selectedAnswer = document.querySelector('input[name="q1"]:checked')?.value;
            
            if (!selectedAnswer) return alert('Valitse vastaus ennen lähettämistä!');

            // Lähetetään vastaus JSON-muodossa Python-taustajärjestelmälle
            const response = await fetch('/submit-exam', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ vastaus_1: selectedAnswer })
            });

            const result = await response.json();
            alert(result.message);
        });
    </script>
</body>
</html>
