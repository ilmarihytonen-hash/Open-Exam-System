<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        /* Base page reset matching your dashboard background color */
        body {
            background-color: #f8fafc;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Central Login Card Container - matches the deep dark blue sidebar color */
        .login-card {
            background-color: #2b3a4a;
            border: 1px solid #374b61;
            border-radius: 8px;
            padding: 32px;
            width: 100%;
            max-width: 350px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.15), 0 10px 10px -5px rgba(0, 0, 0, 0.1);
        }

        /* Header matching the "Dashboard" sidebar text weight */
        .login-card h2 {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 24px;
            letter-spacing: 0.05em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        /* Gray text labels mimicking your navigation subtext style */
        .form-group label {
            display: block;
            color: #cbd5e1;
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
        }

        /* Input styling matching the white header search bar */
        .form-group input {
            width: 100%;
            box-sizing: border-box;
            padding: 10px 14px;
            background-color: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            font-size: 0.875rem;
            color: #1e293b;
            transition: all 0.2s ease;
            outline: none;
        }

        /* Active blue focus outline matching the active "Home" button glow */
        .form-group input:focus {
            border-color: #3498db;
            box-shadow: 0 0 0 3px rgba(52, 152, 219, 0.25);
        }

        /* Primary action button matching your vibrant blue "Export Data" button */
        .btn-submit {
            width: 100%;
            background-color: #3498db;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 10px;
            font-size: 0.875rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s ease;
            margin-top: 8px;
        }

        .btn-submit:hover {
            background-color: #2980b9;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Dashboard Login</h2>
        
        <form action="/login" method="POST">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required autocomplete="off">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn-submit">Login</button>
        </form>
    </div>

</body>
</html>
