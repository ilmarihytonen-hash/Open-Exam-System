<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student login</title><style>body{font-family:Segoe UI,sans-serif;background:#eef3f6;display:grid;place-items:center;min-height:100vh;color:#263238}.card{background:#fff;padding:32px;width:min(420px,90vw);border-radius:8px;box-shadow:0 4px 18px #0002}label{display:block;margin:14px 0 6px}input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ccd5dc;border-radius:4px}button{margin-top:18px;padding:11px 18px;background:#168bd0;color:#fff;border:0;border-radius:4px;cursor:pointer;width:100%}</style></head><body><main class="card"><h1>Student sign in</h1><p>Enter the identity information required by this examination server.</p><form method="post" action="/student/login"><label for="name">Full name</label><input id="name" name="name" autocomplete="name"><label for="date_of_birth">Date of birth</label><input id="date_of_birth" name="date_of_birth" type="date"><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email"><button type="submit">Continue</button></form></main></body></html>
