<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ exam_title }}</title><style>body{font-family:Segoe UI,sans-serif;margin:0;background:#eef3f6;color:#263238}main{max-width:980px;margin:32px auto;background:#fff;padding:28px;border-radius:8px;box-shadow:0 4px 18px #0002}.question{padding:18px;border:1px solid #d9e2e7;border-radius:6px;margin:14px 0}.question h2{font-size:18px}textarea,select{width:100%;box-sizing:border-box;padding:10px;margin-top:8px;border:1px solid #ccd5dc;border-radius:4px}label{display:block;margin:8px 0}.media{max-width:100%;margin:10px 0}.audio{width:100%}#sync{color:#168c4b;font-size:.9rem}</style></head><body><main><h1>{{ exam_title }}</h1><p>Answers save automatically every second.</p><form id="exam"><div id="questions">Loading questions...</div></form><p id="sync">Waiting for sync...</p></main><script>const examId="{{ exam_id }}";const root=document.getElementById('questions');const sync=document.getElementById('sync');let questions=[];function safe(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function render(q,i){let input='';if(q.type==='multiple_choice')input=q.options.map((o,n)=>'<label><input type="'+(q.multiple?'checkbox':'radio')+'" name="'+q.id+'" value="'+safe(o)+'"> '+safe(o)+'</label>').join('');else if(q.type==='ordering')input='<select multiple size="'+Math.min(q.items.length,8)+'" data-answer="'+q.id+'">'+q.items.map(x=>'<option>'+safe(x)+'</option>').join('')+'</select>';else if(q.type==='file_upload')input='<input type="file" data-answer="'+q.id+'" accept="'+q.allowed_extensions.map(x=>'.'+safe(x)).join(',')+'">';else input='<textarea data-answer="'+q.id+'" maxlength="'+q.max_chars+'" placeholder="Maximum '+q.max_chars+' characters"></textarea>';let media=q.media?(q.media.kind==='image'?'<img class="media" src="'+safe(q.media.url)+'" alt="'+safe(q.media.alt||'Exam image')+'">':'<audio class="audio" controls src="'+safe(q.media.url)+'"></audio>'):'';return '<section class="question"><h2>'+(i+1)+'. '+safe(q.prompt)+'</h2>'+media+input+'</section>'}function collect(){const result={};questions.forEach(q=>{if(q.type==='multiple_choice'){const values=[...document.querySelectorAll('[name="'+q.id+'"]:checked')].map(x=>x.value);result[q.id]=q.multiple?values:(values[0]||'')}else if(q.type==='ordering'){const el=document.querySelector('[data-answer="'+q.id+'"]');result[q.id]=el?[...el.selectedOptions].map(x=>x.value):[]}else if(q.type==='file_upload'){const el=document.querySelector('[data-answer="'+q.id+'"]');result[q.id]=el&&el.files[0]?el.files[0].name:''}else{const el=document.querySelector('[data-answer="'+q.id+'"]');result[q.id]=el?el.value:''}});return result}function syncAnswers(){fetch('/api/student/exams/'+examId+'/answers',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({answers:collect()})}).then(r=>sync.textContent=r.ok?'Saved '+new Date().toLocaleTimeString():'Save failed').catch(()=>sync.textContent='Offline: save failed')}setInterval(syncAnswers,1000);document.addEventListener('visibilitychange',()=>{if(document.hidden)fetch('/api/student/exams/'+examId+'/violations',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind:'tab_hidden',details:'Exam tab lost focus'})})});fetch('/api/student/exams/'+examId).then(r=>r.json()).then(data=>{questions=data.exam.questions;root.innerHTML=questions.map(render).join('')||'<p>No questions loaded.</p>'})</script></body></html>
