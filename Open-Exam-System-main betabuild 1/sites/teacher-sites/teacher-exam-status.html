<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam monitor</title><style>body{font-family:Segoe UI,sans-serif;margin:0;background:#eef3f6;color:#263238}aside{width:230px;min-height:100vh;background:#263746;padding:24px;box-sizing:border-box;float:left}aside h2{color:#fff;font-size:20px}a{display:block;color:#c9d4dc;text-decoration:none;padding:10px 0}a:hover,a.active{color:#55b9ed}main{margin-left:230px;padding:30px;max-width:1250px}.toolbar,.panel{background:#fff;padding:20px;border-radius:8px;box-shadow:0 3px 12px #0001;margin-bottom:18px}.toolbar{display:flex;justify-content:space-between;align-items:center}.danger{background:#b93838!important}.exam{border:1px solid #d7e0e5;border-radius:6px;padding:14px;margin:10px 0}.exam button,button{padding:9px 13px;border:0;border-radius:4px;background:#168bd0;color:#fff;margin:5px 5px 0 0}.students{max-height:520px;overflow:auto;border:1px solid #d7e0e5}.student{display:grid;grid-template-columns:1.2fr 1fr 1fr 110px 120px;gap:10px;align-items:center;padding:14px;border-bottom:1px solid #e2e8ed}.healthy{color:#168c4b;font-weight:600}.ended{color:#b93838;font-weight:600}.small{color:#60727d;font-size:13px}pre{white-space:pre-wrap;background:#202b35;color:#dce7ed;padding:14px;border-radius:4px;max-height:320px;overflow:auto}</style></head><body><aside><h2>Teacher</h2><a href="/teacher/dashboard">Dashboard</a><a class="active" href="/teacher/exam-status">Exam monitor</a><a href="/teacher/students">Students</a><a href="/teacher/exam-maker">Exam maker</a><a href="/teacher/preview-exam">Preview</a><a href="/teacher/logs">Logs</a></aside><main><div class="toolbar"><h1>Exam monitor</h1><form method="post" action="/api/teacher/exams/stop-all"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="danger">End all my active exams</button></form></div><section class="panel"><h2>My exams</h2><div id="exams">Loading...</div></section><section class="panel"><h2>Students and live status</h2><div class="students" id="students">Select an active exam.</div></section><section class="panel"><h2>Answer and violation stream</h2><pre id="monitor">Select an exam.</pre></section></main><script>let selected=null;const exams=document.getElementById('exams'),students=document.getElementById('students'),monitor=document.getElementById('monitor');function esc(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}function loadExams(){fetch('/api/teacher/exams').then(r=>r.json()).then(data=>{exams.innerHTML=data.exams.map(e=>'<div class="exam"><strong>'+esc(e.title)+'</strong> <span>'+e.status+'</span> <button onclick="selectExam(\''+e.id+'\')">Monitor</button>'+(e.status==='draft'?'<form method="post" action="/api/teacher/exams/'+e.id+'/status" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="status" value="active"><button>Start</button></form>':'')+(e.status==='active'?'<form method="post" action="/api/teacher/exams/'+e.id+'/status" style="display:inline"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="status" value="stopped"><button class="danger">End exam</button></form>':'')+'</div>').join('')||'No exams.'})}function selectExam(id){selected=id;refresh()}function refresh(){if(!selected)return;fetch('/api/teacher/exams/'+selected+'/monitor').then(r=>r.json()).then(data=>{students.innerHTML=(data.students||[]).map(s=>'<div class="student"><strong>'+esc(s.name)+'</strong><span>'+esc(s.email||'')+'</span><span>'+esc(s.date_of_birth||'')+'</span><span class="'+(s.status==='active'?'healthy':'ended')+'">'+s.status+'</span>'+(s.status==='active'?'<form method="post" action="/api/teacher/exams/'+selected+'/students/'+s.student_id+'/end"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button class="danger">End</button></form>':'<span class="small">Ended</span>')+'</div>').join('')||'No students connected.';monitor.textContent=JSON.stringify({answers:data.answers,violations:data.violations},null,2)})}loadExams();setInterval(()=>{loadExams();refresh()},2000)</script></body></html>
