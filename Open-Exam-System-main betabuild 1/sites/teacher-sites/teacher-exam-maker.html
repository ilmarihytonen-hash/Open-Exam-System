<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Exam maker</title><style>body{font-family:Segoe UI,sans-serif;margin:0;background:#eef3f6;color:#263238}aside{width:230px;min-height:100vh;background:#263746;padding:24px;box-sizing:border-box;float:left}aside h2{color:#fff;font-size:20px}a{display:block;color:#c9d4dc;text-decoration:none;padding:10px 0}a:hover,a.active{color:#55b9ed}main{margin-left:230px;padding:36px;max-width:1100px}.panel,.question{background:#fff;padding:22px;border-radius:8px;box-shadow:0 3px 12px #0001;margin-bottom:18px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-weight:600;margin:8px 0 5px}input,select,textarea{width:100%;box-sizing:border-box;padding:9px;border:1px solid #ccd5dc;border-radius:4px}button{padding:10px 16px;background:#168bd0;color:#fff;border:0;border-radius:4px;cursor:pointer;margin:6px 6px 0 0}.remove{background:#b93838}.question{border-left:5px solid #168bd0}.question h3{margin-top:0}.muted{color:#60727d}</style></head><body><aside><h2>Teacher</h2><a href="/teacher/dashboard">Dashboard</a><a href="/teacher/exam-status">Exam status</a><a href="/teacher/students">Students</a><a class="active" href="/teacher/exam-maker">Exam maker</a><a href="/teacher/preview-exam">Preview</a><a href="/teacher/logs">Logs</a><a href="/teacher/version">Version</a><a href="/teacher/license">License</a></aside><main><h1>Exam maker</h1><form method="post" action="/api/teacher/exams" id="exam-form"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="questions" id="questions-json"><section class="panel"><div class="grid"><label>Exam title<input name="title" required></label><label>Description<input name="description" placeholder="Instructions for students"></label><label>Parts, comma-separated<input name="parts" value="Part 1, Part 2"></label><label>Lock later parts until completion<select name="lock_parts"><option value="true">Enabled</option><option value="false">Disabled</option></select></label></div><p class="muted">Question types: written, multiple choice, ordering, file upload, image, and audio. Assign each question to a part.</p></section><div id="questions"></div><button type="button" onclick="addQuestion()">Add question</button><button type="submit">Save exam draft</button></form></main><script>let count=0;const root=document.getElementById('questions');function addQuestion(){count++;const el=document.createElement('section');el.className='question';el.innerHTML='<h3>Question '+count+'</h3><div class="grid"><label>Type<select class="type" onchange="refresh(this)"><option value="written">Written answer</option><option value="multiple_choice">Multiple choice</option><option value="ordering">Ordering</option><option value="file_upload">File upload</option></select></label><label>Part<input class="part" value="Part 1"></label><label>Points<input class="points" type="number" min="0" value="1"></label><label>Prompt<textarea class="prompt" rows="3" required></textarea></label></div><div class="extra"></div><button type="button" class="remove" onclick="this.parentElement.remove()">Remove</button>';root.appendChild(el);refresh(el.querySelector('.type'))}function refresh(select){const box=select.closest('.question').querySelector('.extra');if(select.value==='multiple_choice')box.innerHTML='<label>Choices, one per line<textarea class="options" rows="4"></textarea></label><label><input class="multiple" type="checkbox"> Allow multiple selections</label>';else if(select.value==='written')box.innerHTML='<label>Maximum characters<input class="max_chars" type="number" min="1" value="2000"></label>';else if(select.value==='ordering')box.innerHTML='<label>Items, one per line<textarea class="items" rows="4"></textarea></label>';else box.innerHTML='<label>Allowed extensions<input class="extensions" value="pdf,png,jpg"></label><label>Maximum MB<input class="max_mb" type="number" min="1" value="10"></label>';box.innerHTML+='<label>Media kind<select class="media_kind"><option value="">None</option><option value="image">Image</option><option value="audio">Audio</option></select></label><label>Media URL<input class="media_url" placeholder="https://... or /media/..."></label>'}function collect(){return [...root.children].map((el,i)=>{const type=el.querySelector('.type').value;const q={id:'q'+(i+1),type,part:el.querySelector('.part').value,prompt:el.querySelector('.prompt').value,points:Number(el.querySelector('.points').value)||0};if(type==='multiple_choice'){q.options=el.querySelector('.options').value.split('\n').filter(Boolean);q.multiple=el.querySelector('.multiple').checked}else if(type==='written')q.max_chars=Number(el.querySelector('.max_chars').value)||2000;else if(type==='ordering')q.items=el.querySelector('.items').value.split('\n').filter(Boolean);else{q.allowed_extensions=el.querySelector('.extensions').value.split(',').map(x=>x.trim()).filter(Boolean);q.max_mb=Number(el.querySelector('.max_mb').value)||10}const kind=el.querySelector('.media_kind').value,url=el.querySelector('.media_url').value;if(kind&&url)q.media={kind,url};return q})}document.getElementById('exam-form').addEventListener('submit',()=>{document.getElementById('questions-json').value=JSON.stringify(collect())});addQuestion()</script></body></html>
