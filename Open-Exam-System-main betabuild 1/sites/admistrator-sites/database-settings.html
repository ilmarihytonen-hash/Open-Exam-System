<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Database settings</title><style>body{font-family:Segoe UI,sans-serif;margin:0;background:#f4f6f9;color:#263238}aside{width:230px;min-height:100vh;background:#263746;padding:24px;box-sizing:border-box;float:left}aside h2{color:#fff;font-size:20px}a{display:block;color:#c9d4dc;text-decoration:none;padding:10px 0}a:hover,a.active{color:#55b9ed}main{margin-left:230px;padding:36px}.panel{background:#fff;padding:24px;border-radius:8px;max-width:800px;box-shadow:0 3px 12px #0001}form{border-top:1px solid #e2e8ed;padding:14px 0}label{display:block;margin:8px 0 5px}input,select{padding:9px;width:100%;box-sizing:border-box;border:1px solid #ccd5dc;border-radius:4px}button{margin-top:10px;padding:10px 16px;background:#168bd0;color:#fff;border:0;border-radius:4px}</style></head><body><aside><h2>Administrator</h2><a href="/admin/dashboard">Dashboard</a><a href="/admin/network">Network</a><a href="/admin/security">Security</a><a href="/admin/cluster">Cluster</a><a class="active" href="/admin/database">Database</a><a href="/admin/ssh">SSH</a><a href="/admin/system">Debian server</a><a href="/admin/logs">Logs</a></aside><main><h1>Database settings</h1><section class="panel"><p>Exam answers and violations remain in SQLite until explicitly deleted. Backups are controlled separately.</p><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="database_url"><label>Database URL<input name="value" data-setting="database_url" required></label><button>Save database URL</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="database_wal"><label>SQLite WAL mode<select name="value" data-setting="database_wal"><option value="true">Enabled</option><option value="false">Disabled</option></select></label><button>Save WAL policy</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="database_backup_enabled"><label>Backups<select name="value" data-setting="database_backup_enabled"><option value="false">Disabled</option><option value="true">Enabled</option></select></label><button>Save backup policy</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="database_backup_dir"><label>Backup directory<input name="value" data-setting="database_backup_dir" required></label><button>Save backup directory</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="database_backup_interval"><label>Backup interval seconds<input name="value" data-setting="database_backup_interval" type="number" min="60" max="604800" required></label><button>Save backup interval</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="database_max_size_mb"><label>Size warning threshold MB<input name="value" data-setting="database_max_size_mb" type="number" min="10" required></label><button>Save size threshold</button></form></section></main><script>fetch('/api/admin/config').then(r=>r.json()).then(data=>Object.entries(data.config).forEach(([key,value])=>{const field=document.querySelector('[data-setting="'+key+'"]');if(field)field.value=String(value)}))</script></body></html>
