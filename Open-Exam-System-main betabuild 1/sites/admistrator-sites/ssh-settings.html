<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SSH settings</title><style>body{font-family:Segoe UI,sans-serif;margin:0;background:#f4f6f9;color:#263238}aside{width:230px;min-height:100vh;background:#263746;padding:24px;box-sizing:border-box;float:left}aside h2{color:#fff;font-size:20px}a{display:block;color:#c9d4dc;text-decoration:none;padding:10px 0}a:hover,a.active{color:#55b9ed}main{margin-left:230px;padding:36px}.panel{background:#fff;padding:24px;border-radius:8px;max-width:800px;box-shadow:0 3px 12px #0001}form{border-top:1px solid #e2e8ed;padding:14px 0}label{display:block;margin:8px 0 5px}input,select{padding:9px;width:100%;box-sizing:border-box;border:1px solid #ccd5dc;border-radius:4px}button{margin-top:10px;padding:10px 16px;background:#168bd0;color:#fff;border:0;border-radius:4px}</style></head><body><aside><h2>Administrator</h2><a href="/admin/dashboard">Dashboard</a><a href="/admin/network">Network</a><a href="/admin/security">Security</a><a href="/admin/cluster">Cluster</a><a href="/admin/database">Database</a><a class="active" href="/admin/ssh">SSH</a><a href="/admin/system">Debian server</a><a href="/admin/logs">Logs</a></aside><main><h1>SSH settings</h1><section class="panel"><p>Passwords are never stored here. Use an SSH key and known-hosts verification.</p><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="ssh_host"><label>SSH host<input name="value" data-setting="ssh_host" required></label><button>Save host</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="ssh_port"><label>SSH port<input name="value" data-setting="ssh_port" type="number" min="1" max="65535" required></label><button>Save port</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="ssh_user"><label>SSH user<input name="value" data-setting="ssh_user" required></label><button>Save user</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="ssh_key_path"><label>Private key path<input name="value" data-setting="ssh_key_path" placeholder="/home/oesadmin/.ssh/id_ed25519"></label><button>Save key path</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="ssh_known_hosts"><label>Known-hosts file<input name="value" data-setting="ssh_known_hosts" required></label><button>Save known-hosts path</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="ssh_connect_timeout"><label>Connection timeout seconds<input name="value" data-setting="ssh_connect_timeout" type="number" min="1" max="120" required></label><button>Save timeout</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="ssh_allow_poweroff"><label>Allow configured poweroff<select name="value" data-setting="ssh_allow_poweroff"><option value="false">No</option><option value="true">Yes</option></select></label><button>Save poweroff policy</button></form></section></main><script>fetch('/api/admin/config').then(r=>r.json()).then(data=>Object.entries(data.config).forEach(([key,value])=>{const field=document.querySelector('[data-setting="'+key+'"]');if(field)field.value=String(value)}))</script></body></html>
