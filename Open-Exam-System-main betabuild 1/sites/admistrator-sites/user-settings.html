<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Teacher accounts</title><style>body{font-family:Segoe UI,sans-serif;margin:0;background:#f4f6f9;color:#263238}aside{width:230px;min-height:100vh;background:#263746;padding:24px;box-sizing:border-box;float:left}aside h2{color:#fff;font-size:20px}a{display:block;color:#c9d4dc;text-decoration:none;padding:10px 0}a:hover,a.active{color:#55b9ed}main{margin-left:230px;padding:36px}.panel{background:#fff;padding:24px;border-radius:8px;max-width:850px;box-shadow:0 3px 12px #0001;margin-bottom:20px}label{display:block;margin:12px 0 5px}input{padding:10px;width:100%;box-sizing:border-box;border:1px solid #ccd5dc;border-radius:4px}button{margin-top:12px;padding:10px 16px;background:#168bd0;color:#fff;border:0;border-radius:4px}.account{border-top:1px solid #e2e8ed;padding:16px 0}.note{color:#60727d}</style></head><body><aside><h2>Administrator</h2><a href="/admin/dashboard">Dashboard</a><a class="active" href="/admin/users">Teacher accounts</a><a href="/admin/students">Students</a><a href="/admin/security">Security</a><a href="/admin/system">Debian server</a></aside><main><h1>Teacher accounts</h1><section class="panel"><h2>Login credentials</h2><p class="note">Usernames and display names are shown below. Passwords are never displayed. Use the reset form to issue a new password securely.</p><div id="accounts">Loading accounts...</div></section><section class="panel"><h2>Create individual teacher</h2><form method="post" action="/api/admin/teachers"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Username<input name="username" pattern="[A-Za-z0-9_.-]+" required></label><label>Display name<input name="display_name" required></label><label>Initial password, minimum 10 characters<input name="password" type="password" minlength="10" required></label><button>Create teacher account</button></form></section></main><script>function esc(v){return String(v).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]))}fetch('/api/admin/teachers').then(r=>r.json()).then(data=>{document.getElementById('accounts').innerHTML=data.teachers.map(t=>'<div class="account"><strong>Username:</strong> '+esc(t.username)+'<br><strong>Name:</strong> '+esc(t.display_name)+'<br><strong>Status:</strong> '+(t.enabled?'Enabled':'Disabled')+'<form method="post" action="/api/admin/teachers/'+encodeURIComponent(t.username)+'/password"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>New password<input name="password" type="password" minlength="10" required></label><button>Reset password</button></form></div>').join('')||'No teacher accounts found.'})</script></body></html>
