<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Security settings</title><style>body{font-family:Segoe UI,sans-serif;margin:0;background:#f4f6f9;color:#263238}aside{width:230px;min-height:100vh;background:#263746;padding:24px;box-sizing:border-box;float:left}aside h2{color:#fff;font-size:20px}a{display:block;color:#c9d4dc;text-decoration:none;padding:10px 0}a:hover,a.active{color:#55b9ed}main{margin-left:230px;padding:36px}.panel{background:#fff;padding:24px;border-radius:8px;max-width:800px;box-shadow:0 3px 12px #0001}form{border-top:1px solid #e2e8ed;padding:14px 0}label{display:block;margin:8px 0 5px}input,select{padding:9px;width:100%;box-sizing:border-box;border:1px solid #ccd5dc;border-radius:4px}button{margin-top:10px;padding:10px 16px;background:#168bd0;color:#fff;border:0;border-radius:4px}</style></head><body><aside><h2>Administrator</h2><a href="/admin/dashboard">Dashboard</a><a href="/admin/network">Network</a><a class="active" href="/admin/security">Security</a><a href="/admin/cluster">Cluster</a><a href="/admin/database">Database</a><a href="/admin/ssh">SSH</a><a href="/admin/system">Debian server</a><a href="/admin/logs">Logs</a></aside><main><h1>Security settings</h1><section class="panel"><p>Session cookies are encrypted and CSRF-protected. Production should use HTTPS.</p><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="https_only"><label>HTTPS-only deployment<select name="value" data-setting="https_only"><option value="false">Disabled for local testing</option><option value="true">Enabled</option></select></label><button>Save HTTPS policy</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="session_hours"><label>Session lifetime hours<input name="value" data-setting="session_hours" type="number" min="1" max="168" required></label><button>Save session lifetime</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="session_cookie_secure"><label>Secure cookie flag<select name="value" data-setting="session_cookie_secure"><option value="false">Disabled for local testing</option><option value="true">Enabled</option></select></label><button>Save cookie policy</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="log_level"><label>Log level<input name="value" data-setting="log_level" required></label><button>Save log level</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="log_retention_days"><label>Log retention days<input name="value" data-setting="log_retention_days" type="number" min="1" max="3650" required></label><button>Save log retention</button></form></section></main><script>fetch('/api/admin/config').then(r=>r.json()).then(data=>Object.entries(data.config).forEach(([key,value])=>{const field=document.querySelector('[data-setting="'+key+'"]');if(field)field.value=String(value)}))</script></body></html>
