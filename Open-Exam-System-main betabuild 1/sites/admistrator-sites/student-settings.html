<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student settings</title><style>body{font-family:Segoe UI,sans-serif;margin:0;background:#f4f6f9;color:#263238}aside{width:230px;min-height:100vh;background:#263746;padding:24px;box-sizing:border-box;float:left}aside h2{color:#fff;font-size:20px}a{display:block;color:#c9d4dc;text-decoration:none;padding:10px 0}a:hover,a.active{color:#55b9ed}main{margin-left:230px;padding:36px}.panel{background:#fff;padding:24px;border-radius:8px;max-width:760px;box-shadow:0 3px 12px #0001}form{border-top:1px solid #e2e8ed;padding-top:14px;margin-top:14px}label{display:block;margin:8px 0}input,select{padding:9px;width:100%;box-sizing:border-box;border:1px solid #ccd5dc;border-radius:4px}button{margin-top:10px;padding:10px 16px;background:#168bd0;color:#fff;border:0;border-radius:4px}</style></head><body><aside><h2>Administrator</h2><a href="/admin/dashboard">Dashboard</a><a href="/admin/users">Users</a><a class="active" href="/admin/students">Students</a><a href="/admin/system">System</a><a href="/admin/logs">Logs</a></aside><main><h1>Student login settings</h1><section class="panel"><p>These controls decide which identity fields students must provide.</p><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="student_require_name"><label>Name required<select name="value"><option value="true">Yes</option><option value="false">No</option></select></label><button type="submit">Save name policy</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="student_require_dob"><label>Date of birth required<select name="value"><option value="true">Yes</option><option value="false">No</option></select></label><button type="submit">Save birth-date policy</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="student_require_email"><label>Email required and validated<select name="value"><option value="true">Yes</option><option value="false">No</option></select></label><button type="submit">Save email policy</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="student_allowed_apps"><label>Allowed applications<input name="value" value="firefox,plasmashell,kwin_wayland"></label><button type="submit">Save allowed apps</button></form><form method="post" action="/api/admin/config"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><input type="hidden" name="key" value="student_forbidden_apps"><label>Forbidden applications<input name="value" value="chromium,google-chrome,libreoffice,code,konsole"></label><button type="submit">Save forbidden apps</button></form></section></main></body></html>
