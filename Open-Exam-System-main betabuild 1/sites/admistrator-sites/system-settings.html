<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Debian server settings</title><style>body{font-family:Segoe UI,sans-serif;margin:0;background:#f4f6f9;color:#263238}aside{width:230px;min-height:100vh;background:#263746;padding:24px;box-sizing:border-box;float:left}aside h2{color:#fff;font-size:20px}a{display:block;color:#c9d4dc;text-decoration:none;padding:10px 0}a:hover,a.active{color:#55b9ed}main{margin-left:230px;padding:36px}.panel{background:#fff;padding:22px;border-radius:8px;max-width:900px;box-shadow:0 3px 12px #0001;margin-bottom:20px}form{border-top:1px solid #e2e8ed;padding-top:14px;margin-top:14px}label{display:block;margin:8px 0 6px}input,select{padding:9px;width:100%;box-sizing:border-box;border:1px solid #ccd5dc;border-radius:4px}button{margin-top:10px;padding:10px 16px;background:#168bd0;color:#fff;border:0;border-radius:4px}.danger{background:#b93838}pre{white-space:pre-wrap;background:#202b35;color:#dce7ed;padding:14px;border-radius:4px;max-height:420px;overflow:auto}</style></head><body><aside><h2>Administrator</h2><a href="/admin/dashboard">Dashboard</a><a href="/admin/network">Network</a><a href="/admin/security">Security</a><a href="/admin/cluster">Cluster</a><a href="/admin/database">Database</a><a href="/admin/ssh">SSH</a><a class="active" href="/admin/system">Debian server</a><a href="/admin/server-status">Server status</a><a href="/admin/logs">Logs</a></aside><main><h1>Debian 13 server administration</h1><section class="panel"><h2>Server inventory</h2><button type="button" onclick="loadOverview()">Refresh inventory</button><pre id="overview">Loading...</pre></section><section class="panel"><h2>Controlled system changes</h2><p>Changes require OES_ALLOW_SYSTEM_CHANGES=1 and exact sudoers permissions on the server.</p><form method="post" action="/api/admin/server/service"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Managed service<input name="service" value="oes-server.service" required></label><label>Action<select name="action"><option>status</option><option>start</option><option>stop</option><option>restart</option><option>enable</option><option>disable</option></select></label><button type="submit">Run service action</button></form><form method="post" action="/api/admin/server/hostname"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Hostname<input name="hostname" placeholder="oes-server-01" required></label><button type="submit">Change hostname</button></form><form method="post" action="/api/admin/server/timezone"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Timezone<input name="timezone" value="Europe/Helsinki" required></label><button type="submit">Change timezone</button></form></section><section class="panel"><h2>Power actions</h2><form method="post" action="/api/admin/server/power"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><label>Action<select name="action"><option value="reboot">Reboot</option><option value="poweroff">Power off</option></select></label><label>Type the action again to confirm<input name="confirmation" placeholder="reboot or poweroff" required></label><button class="danger" type="submit">Execute power action</button></form></section></main><script>function loadOverview(){fetch('/api/admin/server/overview').then(r=>r.json()).then(data=>document.getElementById('overview').textContent=JSON.stringify(data,null,2)).catch(()=>document.getElementById('overview').textContent='Unable to load server inventory')}loadOverview()</script></body></html>
