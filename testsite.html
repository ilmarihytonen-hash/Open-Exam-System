<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; background: #f4f6f9; height: 100vh; }
        
        /* Sivupalkki */
        .sidebar { width: 250px; background: #2c3e50; color: white; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .sidebar h3 { margin-top: 0; color: #ecf0f1; font-size: 1.2rem; border-bottom: 1px solid #34495e; padding-bottom: 10px; }
        .menu-item { padding: 12px; border-radius: 6px; cursor: pointer; color: #bdc3c7; text-decoration: none; transition: 0.2s; }
        .menu-item:hover { background: #34495e; color: white; }
        .menu-item.active { background: #3498db; color: white; font-weight: bold; }
        
        /* Sisältöalue */
        .content { flex: 1; padding: 30px; }
        .toolbar { display: flex; gap: 15px; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); align-items: center; }
        
        /* Kontrollit */
        .search-bar { width: 300px; padding: 10px 15px; border: 1px solid #ced4da; border-radius: 6px; font-size: 0.9rem; }
        .search-bar:focus { outline: none; border-color: #3498db; }
        .btn-export { padding: 10px 20px; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; transition: 0.2s; }
        .btn-export:hover { background: #2980b9; }
    </style>
</head>
<body>

    <!-- <sidebar> -->
    <div class="sidebar">
        <h3>Dashboard</h3>
        <a href="#" class="menu-item active">Home</a>
        <a href="#" class="menu-item">Analytics</a>
    </div>

    <!-- <content_area> -->
    <div class="content">
        <!-- <toolbar> -->
        <div class="toolbar">
            <input type="text" class="search-bar" placeholder="Search records...">
            <button class="btn-export">Export Data</button>
        </div>
    </div>

</body>
</html>
